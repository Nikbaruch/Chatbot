<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Chatbot GPT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        #chatbox {
            width: 100%;
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .bubble {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .user {
            background: #d0e7ff;
            text-align: right;
        }
        .bot {
            background: #e9e9e9;
        }
    </style>
</head>
<body>
    <div id="chatbox">
        <h2>💬 Chatbot GPT-4.1 hébergé sur Vercel</h2>

        <div id="messages"></div>

        <textarea id="input" rows="3" style="width:100%; margin-top:10px;" placeholder="Écris un message..."></textarea>
        <button onclick="sendMessage()" style="margin-top:10px; padding:10px 20px;">Envoyer</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, "user");
            input.value = "";

            const res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: text})
            });

            const data = await res.json();

            if (data.reply) {
                addMessage(data.reply, "bot");
            } else {
                addMessage("❌ Erreur : " + data.error, "bot");
            }
        }

        function addMessage(text, type) {
            const box = document.getElementById("messages");
            const div = document.createElement("div");
            div.classList.add("bubble", type);
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
